# Development override: publishes the backing services to the host so the API and the web
# app can run natively with `pnpm dev` (fast reload, real debugger).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis minio minio-init
#   pnpm db:migrate && pnpm db:seed && pnpm dev
#
# `up -d` without a service list also builds and runs api + web, mirroring production.

services:
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  redis:
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'

  minio:
    ports:
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'

  api:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      RUN_SEED: ${RUN_SEED:-true}
