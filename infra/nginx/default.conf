# Single public origin behind the Cloudflare Tunnel: the SPA and the API share it, which
# keeps the httpOnly refresh cookie first-party and removes CORS from production.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Cloudflare already terminates TLS and compresses; keep gzip for direct/LAN access.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 100m;

  # Real client IP for the API's audit log, taken from the tunnel.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://api:3000/health;
    proxy_set_header Host $host;
    access_log off;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The service worker and the manifest must never be cached by an intermediary,
  # otherwise a deploy can leave clients pinned to an old shell.
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
