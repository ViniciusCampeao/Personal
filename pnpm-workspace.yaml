packages:
  - apps/*
  - packages/*

# Postinstall scripts are blocked by default; these are the ones we deliberately allow.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  # Its postinstall only copies the browser service worker into `public/`; the web tests
  # mock at the Node level with `setupServer`, so nothing needs it.
  msw: false
  prisma: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/react-query@5.102.8'
  - '@testing-library/react@16.3.3'
